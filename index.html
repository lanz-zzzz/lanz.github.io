<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>私募基金投后陪伴看板 - 私享尊荣</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/echarts.min.js"></script>
<style>
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif; background-color: #f3f4f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .phone-container { width: 390px; height: 812px; background-color: #F5F7FA; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; overflow: hidden; border: 8px solid #1a1a1a; }
    .status-bar { height: 44px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: white; position: absolute; top: 0; width: 100%; z-index: 50; }
    .page-content { transition: opacity 0.3s ease-in-out; height: calc(812px - 84px); overflow-y: auto; scrollbar-width: none; padding-bottom: 20px; }
    .page-content::-webkit-scrollbar { display: none; }
    .hidden { display: none; opacity: 0; }
    .active { display: block; opacity: 1; }
    .bg-gradient-finance { background: linear-gradient(180deg, #1A3A5C 0%, #2A5C8C 100%); }
    .tab-bar { height: 84px; background: white; border-top: 1px solid #e5e7eb; position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; padding-bottom: 20px; z-index: 50; }
    .tab-item { display: flex; flex-direction: column; align-items: center; color: #6B7280; font-size: 11px; cursor: pointer; transition: color 0.2s; }
    .tab-item.active { color: #1A3A5C; }
    .tab-icon { font-size: 24px; margin-bottom: 4px; }
    .text-gold { color: #C9A96E; }
    .finance-card { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin: 12px 16px; padding: 16px; }
    .income-green { color: #34C759; }
    .loss-red { color: #FF3B30; }
    
    /* 新增：数据卡片点击效果 */
    .clickable-card { 
        cursor: pointer; 
        transition: all 0.2s ease; 
        position: relative;
    }
    .clickable-card:active { 
        transform: scale(0.98); 
        background-color: #f9fafb;
    }
    .clickable-card::after {
        content: "🔍";
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 12px;
        opacity: 0.5;
    }
    
    /* 新增：弹层样式 */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
    }
    .overlay.active { display: flex; animation: fadeIn 0.3s; }
    .popup {
        background: white;
        border-radius: 24px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
        animation: slideUp 0.3s;
    }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .popup-title { font-size: 20px; font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 20px; color: #6b7280; cursor: pointer; }
    .popup-content { margin-bottom: 20px; }
    .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #1A3A5C, #2A5C8C); color: white; }
    .btn:active { transform: scale(0.98); }
    
    /* 新增：客服浮窗 */
    .service-overlay { align-items: flex-end; }
    .service-popup { 
        max-width: 480px; 
        border-radius: 24px 24px 0 0; 
        animation: slideUpFromBottom 0.3s;
    }
    .service-options { display: flex; flex-direction: column; gap: 12px; }
    .service-option {
        padding: 20px;
        background: #f8fafc;
        border-radius: 16px;
        border: none;
        font-size: 16px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
    }
    .service-option:active { background: #e5e7eb; }
    
    /* 新增：悬浮按钮 */
    .floating-btn {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #1A3A5C, #2A5C8C);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 4px 20px rgba(26, 58, 92, 0.3);
        cursor: pointer;
        z-index: 100;
        border: none;
        user-select: none;
    }
    .floating-btn:active { transform: scale(0.95); }
    
    /* 新增：工具提示 */
    .chart-tooltip {
        position: absolute;
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        z-index: 100;
        display: none;
        min-width: 180px;
    }
    .tooltip-content { font-size: 14px; }
    .tooltip-btn {
        margin-top: 12px;
        padding: 8px 16px;
        background: linear-gradient(135deg, #1A3A5C, #2A5C8C);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
    }
    
    /* 新增：调仓标记 */
    .rebalance-marker {
        position: absolute;
        cursor: pointer;
        z-index: 10;
    }
    
    /* 新增：热区提示 */
    .hotspot-hint {
        position: absolute;
        background: rgba(255, 59, 48, 0.1);
        border: 2px dashed #FF3B30;
        border-radius: 8px;
        pointer-events: none;
        z-index: 10;
        animation: pulse 2s infinite;
    }
    .hotspot-label {
        position: absolute;
        background: #FF3B30;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUpFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
</style>
</head>
